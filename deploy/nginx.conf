# Família365 (HTTP interno na porta 8080; o TLS fica num proxy à frente). Dados só no navegador (LocalStorage).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Sem hash nos nomes: sempre revalidar (o service worker troca o cache a cada versão).
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Só arquivos desta origem; fotos do mural são data:/blob:. Sem chamadas externas.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  types { text/html html; application/javascript js; text/css css; image/svg+xml svg; application/manifest+json webmanifest; }
  location / { try_files $uri $uri/ =404; }
}
