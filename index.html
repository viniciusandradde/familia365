<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#557663"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Família365</title></head><body><main><header><strong>♡ Família365</strong><small>Presente, propósito e legado</small></header><section class="hero"><small id="date"></small><h1>Construindo nossa história.</h1><p>Uma pequena ação de cada vez.</p></section><nav id="nav" aria-label="Seções"></nav><section><h2 id="heading">Hoje</h2><p id="summary"></p><form id="form"><label>O que deseja realizar?<input id="title" required maxlength="200"></label><label>Dimensão<select id="area"><option>Pessoal</option><option>Casal</option><option>Filhos</option><option>Família</option><option>Espiritualidade</option><option>Finanças</option><option>Saúde</option><option>Lazer</option><option>Conhecimento</option></select></label><label>Horizonte<select id="horizon"><option>Hoje</option><option>7 dias</option><option>30 dias</option><option>90 dias</option><option>1 ano</option><option>5 anos</option><option>10 anos ou mais</option></select></label><label>Prazo (opcional)<input type="date" id="due"></label><label>Observações<textarea id="notes" maxlength="4000"></textarea></label><button id="save">Adicionar</button><button type="button" id="cancel" hidden>Cancelar edição</button></form><div id="list"></div></section><section><h2>Meus dados</h2><p>Os registros ficam neste navegador. Faça backups regularmente. Não há sincronização nem senha nesta versão.</p><button id="export">Exportar backup</button><label class="import">Restaurar backup<input type="file" id="import" accept=".json,application/json"></label><p id="status" role="status"></p></section></main><script src="app.js" defer></script></body></html>
